<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>群聊 AI</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-head">
      <button id="btn-new">+ 新对话</button>
      <button id="btn-settings" title="设置">⚙</button>
    </div>
    <div id="sessions"></div>
  </aside>

  <main id="main">
    <header id="topbar">
      <div class="left">
        <span id="title">新对话</span>
        <span class="mode-switch">
          <button data-mode="single" class="on">单聊</button>
          <button data-mode="group">群聊</button>
        </span>
      </div>
      <div class="right">
        <select id="sel-model" title="单聊用哪个模型"></select>
        <button id="btn-members">成员 <span id="member-count">0</span></button>
        <button id="btn-plugins">插件</button>
        <button id="btn-panel">参数</button>
      </div>
    </header>
    <div id="chat"></div>
    <footer id="composer">
      <textarea id="input" rows="1" placeholder="说点什么…  (Enter 发送 / Shift+Enter 换行)"></textarea>
      <button id="btn-send">发送</button>
    </footer>
  </main>

  <aside id="panel" class="hidden">
    <div class="panel-head">参数 <button id="btn-panel-close">×</button></div>
    <div class="panel-body">
      <label>思考强度 <output id="out-effort">medium</output></label>
      <input type="range" id="rg-effort" min="0" max="4" step="1" value="2">
      <label>温度 <output id="out-temp">0.7</output></label>
      <input type="range" id="rg-temp" min="0" max="2" step="0.1" value="0.7">
      <label>最大输出 token <output id="out-max">2000</output></label>
      <input type="range" id="rg-max" min="256" max="8000" step="128" value="2000">
      <hr>
      <label>群聊轮数</label>
      <select id="sel-rounds">
        <option value="1">1 轮（快）</option>
        <option value="2">2 轮（有交锋）</option>
        <option value="auto" selected>自动（群主判断）</option>
      </select>
      <label>群主</label>
      <select id="sel-host"></select>
      <div class="hint">群主只主持和总结，不参加答题。</div>
      <hr>
      <div class="stat">
        <div><span>本次会话花费</span><b id="stat-cost">¥0.0000</b></div>
        <div><span>请求数</span><b id="stat-req">0</b></div>
      </div>
    </div>
  </aside>
</div>

<div id="modal" class="hidden">
  <div class="modal-box">
    <div class="modal-head"><span id="modal-title">设置</span><button id="modal-close">×</button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
